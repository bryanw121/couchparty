<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0E1020">
<title>CouchParty — Join</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overscroll-behavior: none; }
body { background: #0E1020; color: #F4F5FA; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-user-select: none; user-select: none; }
.wrap { min-height: 100%; max-width: 480px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
.screen { display: none; flex-direction: column; gap: 14px; flex: 1; }
.screen.on { display: flex; }
.logo { font-size: 24px; font-weight: 800; }
.logo span { color: #FFC83D; }
.muted { color: #A9AEC8; font-size: 15px; }
label { font-size: 14px; font-weight: 600; color: #A9AEC8; display: block; margin-bottom: 8px; }
input[type=text] { width: 100%; height: 56px; border-radius: 14px; border: 2px solid #3A3F63; background: #1A1D33; color: #F4F5FA; font-size: 20px; padding: 0 16px; outline: none; font-family: inherit; -webkit-user-select: text; user-select: text; }
input[type=text]:focus { border-color: #FFC83D; }
#room { font-size: 28px; font-weight: 800; letter-spacing: 8px; text-transform: uppercase; }
.colors { display: flex; gap: 10px; flex-wrap: wrap; }
.colors button { width: 46px; height: 46px; border-radius: 50%; border: 4px solid transparent; padding: 0; }
.colors button[aria-pressed="true"] { border-color: #F4F5FA; }
button { font-family: inherit; cursor: pointer; }
.primary { height: 62px; border-radius: 18px; border: 0; background: #FFC83D; color: #0E1020; font-size: 21px; font-weight: 800; }
.primary:disabled { opacity: 0.5; }
.ghost { height: 46px; border-radius: 14px; border: 2px solid #3A3F63; background: transparent; color: #F4F5FA; font-size: 16px; }
.err { color: #FF9F9F; font-size: 15px; min-height: 20px; }
.top { display: flex; align-items: center; justify-content: space-between; }
.who { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
.dot { width: 34px; height: 34px; border-radius: 50%; color: #0E1020; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
.title { font-size: 28px; font-weight: 800; }
.gameopt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 10px; border-radius: 18px; background: #1A1D33; border: 3px solid transparent; color: #F4F5FA; }
.gameopt .pic { width: 104px; height: 66px; border-radius: 12px; overflow: hidden; flex-shrink: 0; pointer-events: none; }
.gameopt[aria-pressed="true"] { border-color: #FFC83D; background: #23284A; }
.gameopt b { font-size: 20px; display: block; }
.banner { border-radius: 14px; padding: 12px; text-align: center; font-weight: 800; font-size: 18px; }

/* No double-tap or pinch zoom anywhere on the controller */
html, body, button, .kstick, .kpads { touch-action: manipulation; }
.kstick, .kbtn2 { touch-action: none; }
/* Kart */
#kart.on { position: fixed; inset: 0; padding: max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); background: #0E1020; z-index: 5; }
.kc { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.kbar { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.kplace { font-size: 34px; font-weight: 900; color: #FFC83D; line-height: 1; font-style: italic; }
.ktm { position: relative; width: 90px; height: 10px; border-radius: 5px; background: #23284A; }
.ktm i { position: absolute; top: -5px; left: 50%; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: #F4F5FA; }
.kpill { height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid #3A3F63; background: #1A1D33; color: #C9CDE6; font: 800 14px Inter, sans-serif; touch-action: none; }
.kpill.on { background: #3A3F63; }
.kpill.hot { border-color: #FFC83D; color: #FFC83D; }
.kpads { flex: 1; display: grid; grid-template-columns: 1fr 1.3fr; gap: 12px; min-height: 0; }
.kzone { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.kpad { flex: 1; min-height: 70px; border-radius: 26px; border: 0; color: #0E1020; touch-action: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: italic 900 30px 'Space Grotesk', Inter, sans-serif; user-select: none; -webkit-user-select: none; }
.kpad small { font: 700 13px Inter, sans-serif; opacity: .75; font-style: normal; }
.kpad.on { filter: brightness(1.25); transform: scale(0.98); }
.kpad.drift { background: linear-gradient(160deg, #a9c4ff, #6f95f2); }
.kpad.gas { background: linear-gradient(160deg, #7ff0d6, #3fcfae); flex: 0.7; }
.kpad.item { flex-direction: row; gap: 14px; background: #1A1D33; color: #F4F5FA; border: 3px solid #3A3F63; font-size: 22px; }
.kpad.item.has { border-color: #FFC83D; box-shadow: 0 0 0 4px rgba(255,200,61,.18); }
.kpad.item.rolling { border-color: #FFC83D; animation: kroll .3s infinite alternate; }
@keyframes kroll { to { box-shadow: 0 0 0 8px rgba(255,200,61,.25); } }
.kpad.item .lbl { display: flex; flex-direction: column; align-items: flex-start; }
.kpad.item small { color: #A9AEC8; opacity: 1; }
.kstick { position: relative; flex: 1; min-height: 110px; border-radius: 28px; background: #1A1D33; border: 2px solid #3A3F63; touch-action: none; overflow: hidden; }
.kstick .track { position: absolute; left: 12%; right: 12%; top: 50%; height: 10px; margin-top: -5px; border-radius: 5px; background: #23284A; }
.kstick .knob { position: absolute; left: 50%; top: 50%; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #F4F5FA, #A9AEC8); box-shadow: 0 6px 14px rgba(0,0,0,.45); transition: transform .12s; }
.kstick.held .knob { transition: none; }
.kstick .hint { position: absolute; bottom: 10px; width: 100%; text-align: center; font-size: 13px; color: #6B7194; }
.kc.tiltmode .kstick, .kc.tiltmode ~ * .kstick { display: none; }
.kc:not(.tiltmode) #kRecenter, .kc:not(.tiltmode) #kTiltMeter, .kc:not(.tiltmode) #kTiltBtn { display: none !important; }
.kmode { display: flex; background: #1A1D33; border-radius: 999px; padding: 3px; border: 2px solid #3A3F63; }
.kmode button { border: 0; background: transparent; color: #A9AEC8; font: 800 14px Inter, sans-serif; padding: 8px 14px; border-radius: 999px; min-height: 36px; }
.kmode button[aria-pressed="true"] { background: #FFC83D; color: #0E1020; }
@media (orientation: portrait) {
  .kpads { grid-template-columns: 1fr; grid-template-rows: 1.1fr 1fr; }
  .kbar { flex-wrap: wrap; }
}
.steerpick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }


/* Gamepad face buttons */
.kface { position: relative; min-height: 0; display: grid; grid-template-columns: 1.35fr 1fr; grid-template-rows: 1fr 1fr; grid-template-areas: "item gas" "drift brake"; gap: 10px; }
/* Big rounded pads that fill the screen, so they're easy to hit without looking */
.kbtn2 { position: relative; width: 100%; height: 100%; min-height: 0; border-radius: 26px; border: 0; touch-action: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #0E1020; font: italic 900 22px 'Space Grotesk', Inter, sans-serif; box-shadow: inset 0 -7px 0 rgba(0,0,0,.25), 0 6px 14px rgba(0,0,0,.4); user-select: none; -webkit-user-select: none; overflow: hidden; }
.kbtn2.on { filter: brightness(1.25); box-shadow: inset 0 4px 0 rgba(0,0,0,.25); transform: scale(.97); }
.kbtn2.item { grid-area: item; background: #1A1D33; color: #F4F5FA; border: 4px solid #3A3F63; }
.kbtn2.item.has { border-color: #FFC83D; }
.kbtn2.item.rolling { border-color: #FFC83D; animation: kroll .3s infinite alternate; }
.kbtn2.item .ic { width: auto; height: 46%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.kbtn2.item .ic span { width: 100% !important; height: 100% !important; }
.kbtn2.item .lb { font-size: 15px; pointer-events: none; }
.kbtn2.item .half { position: absolute; left: 0; right: 0; height: 50%; display: flex; justify-content: center; font: 800 12px Inter, sans-serif; font-style: normal; letter-spacing: .04em; color: #A9AEC8; pointer-events: none; transition: background .1s; }
.kbtn2.item:not(.dir) .half { display: none; }
.kbtn2.item .half.top { top: 0; align-items: flex-start; padding-top: 6px; border-bottom: 2px dashed rgba(169,174,200,.25); }
.kbtn2.item .half.bot { bottom: 0; align-items: flex-end; padding-bottom: 6px; }
.kbtn2.item.aim-front .half.top, .kbtn2.item.aim-back .half.bot { background: rgba(255,200,61,.22); color: #FFC83D; }
.kbtn2.brake { grid-area: brake; background: linear-gradient(160deg, #ff9b9b, #f05b5b); }
.kbtn2.gas { grid-area: gas; background: linear-gradient(160deg, #7ff0d6, #3fcfae); }
.kbtn2.gas.auto { opacity: .45; }
.kbtn2.drift { grid-area: drift; background: linear-gradient(160deg, #a9c4ff, #6f95f2); font-size: 26px; }
.kitemhint { position: absolute; left: 0; right: 0; top: -18px; text-align: center; font: 700 12px Inter, sans-serif; color: #A9AEC8; pointer-events: none; }
.kstick .base { position: absolute; left: 50%; top: 50%; width: min(80%, 230px); aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle at 50% 45%, #2b3166 0%, #1c2046 60%, #141734 100%); border: 3px solid #3A3F63; box-shadow: inset 0 6px 18px rgba(0,0,0,.55), 0 0 0 6px rgba(255,255,255,.03); }
.kstick .ring { position: absolute; inset: 14%; border-radius: 50%; border: 2px solid rgba(143,180,255,.18); }
.kstick .arrow { position: absolute; top: 50%; width: 0; height: 0; margin-top: -10px; border-top: 10px solid transparent; border-bottom: 10px solid transparent; opacity: .55; transition: opacity .1s, transform .1s; }
.kstick .arrow.l { left: 7%; border-right: 14px solid #8fb4ff; }
.kstick .arrow.r { right: 7%; border-left: 14px solid #8fb4ff; }
.kstick .arrow.on { opacity: 1; transform: scale(1.25); }
.kstick .knob { left: 50%; top: 50%; width: 42%; height: auto; aspect-ratio: 1; margin: 0; translate: -50% -50%; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #ffffff 0%, #dfe3f5 35%, #9aa0c4 100%); box-shadow: 0 8px 18px rgba(0,0,0,.5), inset 0 -4px 8px rgba(0,0,0,.18); }
.kstick .knob::after { content: ''; position: absolute; inset: 24%; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #f4f5fa, #c9cde6); box-shadow: inset 0 2px 4px rgba(0,0,0,.18); }
.kstick.held .knob { box-shadow: 0 0 0 4px #FFC83D, 0 8px 18px rgba(0,0,0,.5); }
.kstick.held .base { border-color: #FFC83D; }
.kc.tiltmode #kLeft { display: none; }
.kc.tiltmode .kpads { grid-template-columns: 1fr; }
.kc.tiltmode .kface { grid-template-columns: 1fr .5fr 1fr; grid-template-areas: "item . gas" "drift . brake"; }
.kc.tiltmode .kitemhint { top: auto; bottom: 4px; }

/* Kart menus (phone) */
.kmp { flex: 1; display: none; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto; padding-bottom: 8px; }
.kmh { display: flex; align-items: center; gap: 10px; }
.kmh .t { flex: 1; font: italic 900 24px 'Space Grotesk', Inter, sans-serif; }
.kmh .back { width: 44px; height: 44px; border-radius: 12px; border: 2px solid #3A3F63; background: #1A1D33; color: #F4F5FA; font-size: 20px; }
.kmdots { display: flex; gap: 5px; }
.kmdots i { width: 22px; height: 6px; border-radius: 3px; background: #3A3F63; }
.kmdots i.on { background: #FFC83D; }
.kmcard { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 84px; padding: 10px 14px; border-radius: 18px; border: 3px solid #2C3160; background: linear-gradient(160deg, #2d2f6e, #1d1f4a); color: #F4F5FA; text-align: left; }
.kmcard.sel { border-color: #FFC83D; }
.kvchips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.kvchip { font: 800 12px Inter, sans-serif; color: #0E1020; padding: 3px 8px; border-radius: 999px; }
.kvn { min-width: 34px; height: 34px; border-radius: 50%; background: #FFC83D; color: #0E1020; font: 900 18px Inter, sans-serif; display: flex; align-items: center; justify-content: center; }
.kmcard .art { width: 60px; height: 60px; flex-shrink: 0; border-radius: 12px; overflow: hidden; }
.kmcard .n { font: italic 900 20px 'Space Grotesk', Inter, sans-serif; }
.kmcard .d { color: #A9AEC8; font-size: 14px; margin-top: 2px; }
.kmgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.kmdrv { position: relative; min-width: 0; width: 100%; aspect-ratio: 1; border-radius: 16px; border: 3px solid #2C3160; background: linear-gradient(160deg, #2d2f6e, #1d1f4a); padding: 4px; }
.kmdrv.mine { border-color: var(--me); box-shadow: 0 0 0 3px rgba(255,255,255,.15); }
.kmdrv .tag { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; font: 900 10px Inter, sans-serif; display: flex; align-items: center; justify-content: center; color: #1b1b3a; }
.kmme { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: #1A1D33; }
.kmme .art { width: 64px; height: 64px; flex-shrink: 0; }
.kmme .n { font: italic 900 20px 'Space Grotesk', Inter, sans-serif; }
.kabar { display: flex; align-items: center; font-size: 12px; color: #A9AEC8; margin-top: 3px; }
.kabar span { width: 62px; }
.kabar i { display: flex; gap: 3px; }
.kabar b { width: 16px; height: 7px; border-radius: 3px; background: #2C3160; }
.kabar b.on { background: #FFC83D; }
.kmbig { width: 100%; min-height: 64px; border-radius: 18px; border: 0; font: italic 900 24px 'Space Grotesk', Inter, sans-serif; background: #FFC83D; color: #0E1020; }
.kmbig.ready { background: #5EE6C8; }
.kmbig.alt { background: #1A1D33; color: #F4F5FA; border: 2px solid #3A3F63; font-size: 18px; min-height: 52px; }
.kmwait { text-align: center; color: #A9AEC8; font-size: 16px; padding: 18px 0; }
/* Poker */
.hole { display: flex; gap: 14px; justify-content: center; }
.pc { width: 120px; height: 168px; border-radius: 16px; background: #fff; color: #0E1020; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 800; }
.pc.red { color: #D23B4C; }
.pc.back { background: repeating-linear-gradient(45deg, #23284A 0 10px, #2C3260 10px 20px); color: transparent; }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.opts button { height: 46px; border-radius: 12px; border: 2px solid #3A3F63; background: #1A1D33; color: #F4F5FA; font-size: 16px; }
.opts button[aria-pressed="true"] { border-color: #FFC83D; background: #23284A; font-weight: 800; }
.presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.presets button { height: 44px; border-radius: 12px; border: 2px solid #3A3F63; background: #1A1D33; color: #F4F5FA; font-size: 15px; }
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.actions button { height: 64px; border-radius: 16px; border: 0; font-size: 18px; font-weight: 800; }
input[type=range] { width: 100%; height: 44px; accent-color: #FFC83D; }
.spinner { width: 36px; height: 36px; border: 4px solid #3A3F63; border-top-color: #FFC83D; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top" id="topbar" style="display:none">
    <div class="who"><div class="dot" id="meDot"></div><span id="meName"></span></div>
    <div class="muted" id="meInfo"></div>
  </div>

  <form class="screen on" id="join" autocomplete="off">
    <div class="logo">Couch<span>Party</span></div>
    <div><label for="room">Room code (on the TV)</label><input type="text" id="room" maxlength="4" autocapitalize="characters" required></div>
    <div><label for="name">Your name</label><input type="text" id="name" maxlength="12" required></div>
    <div><label>Pick a color</label><div class="colors" id="colors"></div></div>
    <div class="err" id="joinErr"></div>
    <button class="primary" id="joinBtn" type="submit" style="margin-top:auto">Join game</button>
    <div class="muted" style="text-align:center">No app, no account. Turn your sound on.</div>
  </form>

  <div class="screen" id="lobby">
    <div id="hostPick" style="display:none; flex-direction:column; gap:12px">
      <div class="title" style="font-size:22px">Pick a game</div>
      <div id="gameOpts" style="display:flex; flex-direction:column; gap:10px"></div>
      <div id="tableOpts" style="display:flex; flex-direction:column; gap:8px"></div>
      <div id="kartPrefs" style="display:none; flex-direction:column; gap:8px"></div>
      <div class="err" id="lobbyErr"></div>
    </div>
    <div class="center" id="guestWait"><div class="title">You're in!</div><div class="muted" id="lobbyInfo"></div></div>
    <button class="primary" id="startBtn" style="display:none; margin-top:auto">Start</button>
  </div>

  <div class="screen" id="poker">
    <div class="banner" id="pkBanner" style="background:#1A1D33"></div>
    <div class="hole" id="hole"></div>
    <div class="muted" style="text-align:center" id="pkHand"></div>
    <div id="pkBank" style="margin-top:auto; display:none; flex-direction:column; gap:10px">
      <button class="primary" id="rebuyBtn">Rebuy</button>
      <button class="ghost" id="cashBtn">Cash out &amp; watch</button>
    </div>
    <div id="pkControls" style="margin-top:auto; display:none; flex-direction:column; gap:10px">
      <div class="presets" id="presets"></div>
      <input type="range" id="raise" min="0" max="100" step="10" aria-label="Raise amount">
      <div class="actions">
        <button id="foldBtn" style="background:#3A3F63; color:#F4F5FA">Fold</button>
        <button id="callBtn" style="background:#5EE6C8; color:#0E1020">Check</button>
        <button id="raiseBtn" style="background:#FFC83D; color:#0E1020">Raise</button>
      </div>
    </div>
    <button class="ghost" id="endBtn" style="display:none">End game (host)</button>
  </div>


  <div class="screen" id="kart">
    <div class="kc" id="kGrid">
      <div class="kbar">
        <span class="kplace" id="kPlace">–</span><span class="muted" id="kLap">Get ready</span>
        <div class="ktm" id="kTiltMeter" aria-hidden="true"><i id="kTiltDot"></i></div>
        <span style="flex:1"></span>
        <button class="kpill" id="kRecenter">Recenter</button>
        <button class="kpill hot" id="kTiltBtn" style="display:none">Turn on tilt</button>
        <div class="kmode" id="kMode"><button data-km="tilt">Tilt</button><button data-km="stick">Stick</button></div>
      </div>
      <div class="kpads">
        <div class="kzone" id="kLeft">
          <div class="kstick" id="kStick" aria-label="Steering stick"><div class="base"><div class="ring"></div><i class="arrow l" id="kArrL"></i><i class="arrow r" id="kArrR"></i><div class="knob" id="kKnob"></div></div><div class="hint">Thumb anywhere · slide ◀ ▶</div></div>
        </div>
        <div class="kface" id="kRight">
          <button class="kbtn2 item" id="kItem" aria-label="Use item"><span class="half top">▲ AHEAD</span><span class="half bot">▼ BEHIND</span><span class="ic" id="kItemIcon"></span><span class="lb" id="kItemName">ITEM</span></button>
          <button class="kbtn2 brake" id="kBrake" aria-label="Brake"><span class="lb">BRAKE</span></button>
          <button class="kbtn2 gas" id="kGas" aria-label="Gas"><span class="lb" id="kGasLbl">GAS</span></button>
          <button class="kbtn2 drift" id="kDrift" aria-label="Drift"><span class="lb">DRIFT</span></button>
          <div class="kitemhint" id="kItemHint"></div>
        </div>
      </div>
    </div>
    <div class="kmp" id="kMenuP"></div>
    <div class="center" id="kWatch" style="display:none"><div class="title">You're watching</div><div class="muted" id="kWatchSub">Up to 4 racers per race</div></div>
  </div>

  <div class="screen" id="final">
    <div class="center"><div class="title" id="finalTitle"></div><div class="muted" id="finalSub"></div></div>
    <button class="primary" id="againBtn" style="display:none">Back to menu</button>
  </div>

  <div class="screen" id="connecting"><div class="center"><div class="spinner"></div><div class="muted">Connecting…</div></div></div>
</div>

<script>
/*KART_ART*/

const COLORS = ['#FFC83D', '#5EE6C8', '#8FB4FF', '#FF9F6B', '#FF7AB6', '#B79CFF', '#9BE36B', '#F4F5FA'];
const SUIT = { s: '♠', h: '♥', d: '♦', c: '♣' };
const $ = (id) => document.getElementById(id);
const fmt = (n) => Number(n).toLocaleString();
const money = (n) => (n < 0 ? '−' : '') + '$' + fmt(Math.abs(n));
const signed = (n) => (n > 0 ? '+' : '') + money(n);
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

let ws, joined = false, pid = store.get('cp_pid'), color = store.get('cp_color') || COLORS[Math.floor(Math.random() * 5)];

let AC = null;
function ac() { if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d, type = 'sine', vol = 0.12, delay = 0) {
  const a = AC; if (!a || a.state !== 'running') return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.02);
}
const PHONE_FX = {

  win: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'square', 0.08, i * 0.1)); buzz([80, 40, 80]); },

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => { retry = 500; if (joined) doJoin(); };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.t === 'ping') return send({ t: 'pong' });
    if (m.t === 'error') { joined = false; $('joinBtn').disabled = false; $('joinErr').textContent = m.msg; show('join'); $('topbar').style.display = 'none'; }
    else if (m.t === 'joined') { joined = true; pid = m.pid; store.set('cp_pid', pid); store.set('cp_room', m.room); history.replaceState(null, '', '/play?room=' + m.room); }
    else if (m.t === 'state' && joined) render(m.s, m.you);
    else if (m.t === 'khud' && joined) kartHud(m.h);
    else if (m.t === 'kev' && joined) kartEvent(m);
    else if (m.t === 'fx' && joined) {
      if (m.n === 'go') PHONE_FX.go();
      if (m.pid === pid && PHONE_FX[m.n]) PHONE_FX[m.n]();
    }
  };
  ws.onclose = () => { if (joined) show('connecting'); setTimeout(connect, retry); retry = Math.min(retry * 2, 8000); };
}
function doJoin() { send({ t: 'join', room: $('room').value.trim().toUpperCase(), name: $('name').value.trim(), color, pid }); }

const ordinal = (n) => n + (n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th');

function tiltAngle(e) {
  const g = e.accelerationIncludingGravity;
  if (!g || g.x == null) return null;
  const a = ((screen.orientation && screen.orientation.angle) || window.orientation || 0) * Math.PI / 180;
  const sx = g.x * Math.cos(a) + g.y * Math.sin(a);
  const sy = -g.x * Math.sin(a) + g.y * Math.cos(a);
  if (Math.hypot(sx, sy) < 2.5) return null; // phone flat on its back: no wheel angle
  return Math.atan2(sx, sy) * 180 / Math.PI;
}
function onMotion(e) {
  const ang = tiltAngle(e);
  if (ang == null) return;
  K.raw = ang;
  if (K.ref == null) K.ref = ang;
  let d = ang - K.ref;
  while (d > 180) d -= 360;
  while (d < -180) d += 360;
  const t = Math.max(-1, Math.min(1, d / 35)); // 35 degrees of wheel turn = full lock
  K.steer += (t - K.steer) * 0.55; // light filter: removes hand shake
  if (K.steerMode === 'tilt') { $('kTiltDot').style.transform = `translateX(${(-K.steer * 40).toFixed(1)}px)`; kartSend(); }
}
async function enableTilt() {
  try {
    const DME = window.DeviceMotionEvent;
    if (DME && typeof DME.requestPermission === 'function') {
      const r = await DME.requestPermission();
      if (r !== 'granted') { K.steerMode = 'stick'; store.set('cp_steer', 'stick'); renderKartPrefs(); kartLayout(); return; }
    }
    if (!K.motionOn) { window.addEventListener('devicemotion', onMotion); K.motionOn = true; }
    K.ref = null;
  } catch { K.steerMode = 'stick'; }
  renderKartPrefs(); kartLayout();
}
function renderKartPrefs() {

}
document.addEventListener('click', (e) => {

function setSteerMode(mode) {

const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const KSTEPN = { mode: 'Choose a mode', speed: 'How fast?', driver: 'Your driver', course: 'Vote for a course', rules: 'Ready to race?' };
const kmSend = (a, v) => { send({ t: 'kmenu', a, v }); buzz(10); };
const kFind = (list, id) => list.find((x) => x.id === id);
function renderKartMenuP(g) {
  const box = $('kMenuP'), L = g.lists, me = YOU.id, cap = YOU.g && YOU.g.captain, racer = YOU.g && YOU.g.racer;
  const capName = esc(g.captainName || 'The host');
  const steps = g.phase === 'standings' ? [] : g.steps, at = steps.indexOf(g.step);

  if (!racer) {
    box.innerHTML = h + `<div class="kmwait">You're watching this race.<br>Up to 4 racers per race.</div>`;
    return;
  }
  const list = (items, art, sel) => items.map((x, i) => `<button class="kmcard${x.id === sel ? ' sel' : ''}" data-kchoose="${x.id}" ${cap ? '' : 'disabled'}><div class="art">${art(x)}</div><div><div class="n">${esc(x.name)}</div><div class="d">${esc(x.blurb || '')}</div></div></button>`).join('');

    h += cap ? `<button class="kmbig" data-km="next">${last ? 'Finish cup' : 'Next race ›'}</button>` : waitCap(last ? 'wrapping up' : 'starting the next race');

  } else if (g.step === 'course') {
    // Everyone votes; the TV shows who picked what and spins on a tie

    const name = (id) => (g.racers.find((r) => r.id === id) || {});

    }).join('') + '</div>';
    h += `<label style="margin-top:4px">Steering</label><div class="opts"><button data-steer="tilt" aria-pressed="${K.steerMode === 'tilt'}">Tilt phone</button><button data-steer="stick" aria-pressed="${K.steerMode === 'stick'}">Joystick</button></div>`;
    h += `<button class="kmbig${mine.ready ? ' ready' : ''}" data-km="ready">${mine.ready ? '✓ Ready! (tap to change)' : 'Ready'}</button>`;
    const waiting = g.picks.filter((p) => !p.ready).length;

// Each moment has its own feel in your hand
const HIT_BUZZ = {
  banana: [60, 40, 60, 40, 60],          // slippery wobble
  green: [220],                          // one solid thump
  red: [90, 40, 220],                    // incoming... thump
  blue: [300, 80, 120, 60, 120, 60, 120],// big zap, then crackle
  star: [160, 50, 160],                  // knocked flying
  bolt: [40, 30, 40, 30, 40, 30, 200],   // fizzle, then shrink
};
function kartEvent(m) {
  if (m.e === 'hit') buzz(HIT_BUZZ[m.item] || [180, 60, 180]);
  else if (m.e === 'bolt') buzz(HIT_BUZZ.bolt);
  else if (m.e === 'landed') buzz([15, 40, 15]);                 // you hit someone: quick double tick
  else if (m.e === 'block') buzz([70, 30, 25]);                  // shield took it
  else if (m.e === 'bump') buzz(35);
  else if (m.e === 'mtboost') buzz(m.level >= 3 ? [30, 25, 30, 25, 30, 25, 120] : m.level === 2 ? [30, 25, 30, 25, 90] : [30, 25, 60]);
  else if (m.e === 'overtake') buzz([20, 30, 50]);
  else if (m.e === 'pickup') buzz(25);
  else if (m.e === 'use') buzz(18);
  else if (m.e === 'lap') buzz(m.fin ? [60, 40, 60, 40, 200] : [40, 40, 40]);
  else if (m.e === 'finish') buzz([100, 50, 100, 50, 300]);
}
function kartSend(force) {
  if (!K.active) return;
  const steer = K.steerMode === 'tilt' ? K.steer : K.stick;
  const m = { t: 'kin', s: Math.round(steer * 100) / 100, g: K.autoGas ? !K.brake : K.gas, b: K.brake, d: K.drift, i: K.item, a: K.aim };
  const key = JSON.stringify(m);
  const now = Date.now();
  if (!force && (key === K.lastSent || now - K.lastAt < 20)) return;
  K.lastSent = key; K.lastAt = now;
  send(m);
}
function holdButton(id, field) {
  const el = $(id);
  const on = (e) => { e.preventDefault(); K[field] = true; el.classList.add('on'); if (field !== 'left' && field !== 'right') buzz(8); kartSend(true); };
  const off = (e) => { e.preventDefault(); K[field] = false; el.classList.remove('on'); kartSend(true); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
}
holdButton('kGas', 'gas'); holdButton('kBrake', 'brake'); holdButton('kDrift', 'drift');
// Item pad: press the top half to throw ahead, the bottom half to throw behind.
// Holding a shield item, slide up or down before letting go to pick the direction.
(function () {
  const el = $('kItem');
  let pid = null;
  const aimAt = (e) => {
    const r = el.getBoundingClientRect();
    const aim = e.clientY > r.top + r.height / 2 ? 'back' : 'front';
    if (aim !== K.aim) { K.aim = aim; if (K.item) { buzz(5); kartSend(true); } }
    el.classList.toggle('aim-front', aim === 'front'); el.classList.toggle('aim-back', aim === 'back');
  };
  const clear = () => { el.classList.remove('aim-front', 'aim-back'); };
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); pid = e.pointerId; try { el.setPointerCapture(pid); } catch (x) {} aimAt(e); K.item = true; el.classList.add('on'); buzz(8); kartSend(true); });
  el.addEventListener('pointermove', (e) => { if (e.pointerId === pid) aimAt(e); });
  const off = (e) => { if (e.pointerId !== pid) return; e.preventDefault(); pid = null; K.item = false; el.classList.remove('on'); clear(); kartSend(true); };
  el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off);
})();
$('kMode').onclick = (e) => { const b = e.target.closest('button'); if (b && b.dataset.km !== K.steerMode) setSteerMode(b.dataset.km); };
// Floating joystick: center is wherever the thumb lands; slide left/right for analog steering
(function () {
  const pad = $('kStick'), knob = $('kKnob');
  const RANGE = 70; // px of thumb travel for full lock
  const move = (e) => {
    if (e.pointerId !== K.stickId) return;
    e.preventDefault();
    const dx = Math.max(-RANGE, Math.min(RANGE, e.clientX - K.stickX));
    K.stick = -dx / RANGE; // left is positive
    knob.style.transform = `translateX(${dx}px) rotate(${(dx / RANGE) * 12}deg)`;
    $('kArrL').classList.toggle('on', K.stick > 0.2); $('kArrR').classList.toggle('on', K.stick < -0.2);
    kartSend();
  };
  const end = (e) => {
    if (e.pointerId !== K.stickId) return;
    K.stickId = null; K.stick = 0; pad.classList.remove('held');
    knob.style.transform = ''; $('kArrL').classList.remove('on'); $('kArrR').classList.remove('on'); kartSend(true);
  };
  pad.addEventListener('pointerdown', (e) => {
    e.preventDefault(); pad.setPointerCapture(e.pointerId);
    K.stickId = e.pointerId; K.stickX = e.clientX; pad.classList.add('held'); buzz(6);
  });
  pad.addEventListener('pointermove', move);
  pad.addEventListener('pointerup', end);
  pad.addEventListener('pointercancel', end);
})();
$('kRecenter').onclick = () => { K.ref = K.raw; buzz(15); };
$('kTiltBtn').onclick = () => enableTilt();

/* Poker controls */
$('hole').addEventListener('click', () => { hideCards = !hideCards; renderPoker(); });
$('raise').addEventListener('input', () => { raiseTo = Number($('raise').value); updateRaise(); });
$('presets').addEventListener('click', (e) => { const v = e.target.dataset && e.target.dataset.v; if (v) { raiseTo = Number(v); $('raise').value = raiseTo; updateRaise(); } });
$('foldBtn').onclick = () => send({ t: 'act', a: 'fold' });
$('callBtn').onclick = () => send({ t: 'act', a: YOU.g.canCheck ? 'check' : 'call' });
$('raiseBtn').onclick = () => send({ t: 'act', a: 'raise', to: raiseTo });
function updateRaise() {
  const g = YOU.g;
  $('raiseBtn').textContent = raiseTo >= g.maxTo ? `All in ${money(g.maxTo)}` : `${g.currentBet ? 'Raise to' : 'Bet'} ${money(raiseTo)}`;
}

function render(s, you) {
  S = s; YOU = you;
  $('joinBtn').disabled = false;
  $('topbar').style.display = 'flex';
  $('meDot').style.background = you.color;
  $('meDot').textContent = you.name.charAt(0).toUpperCase();
  $('meName').textContent = you.name;
  $('endBtn').style.display = you.isHost ? 'block' : 'none';
  if (s.phase === 'lobby') renderLobby();
  else if (s.phase === 'final') renderFinal();
  else if (s.g && s.g.kind === 'poker') renderPoker();
  else if (s.g && s.g.kind === 'kart') renderKart();
  if (!(s.g && s.g.kind === 'kart')) kartStop();
  renderKartPrefs();
}

function renderLobby() {
  show('lobby');
  $('meInfo').textContent = `Room ${S.code}`;
  const host = S.players.find((p) => p.isHost);
  const game = S.games.find((g) => g.id === S.selected);
  $('hostPick').style.display = YOU.isHost ? 'flex' : 'none';
  $('guestWait').style.display = YOU.isHost ? 'none' : 'flex';
  $('startBtn').style.display = YOU.isHost ? 'block' : 'none';
  if (YOU.isHost) {
    $('gameOpts').innerHTML = S.games.map((g) => { const gi = KA.info(g.id); return `<button class="gameopt" data-g="${g.id}" aria-pressed="${g.id === S.selected}"><span class="pic">${KA.game(g.id)}</span><span data-g="${g.id}"><b data-g="${g.id}">${g.name}</b><span class="muted" data-g="${g.id}">${gi.tag || g.blurb} · ${gi.players || `${g.min}–${g.max} players`}</span></span></button>`; }).join('');
    const st = S.settings && S.settings[game.id];
    $('tableOpts').innerHTML = game.options && st ? Object.entries(game.options).map(([k, vals]) =>
      `<label>${OPT_LABEL[k]}</label><div class="opts">${vals.map((v) => `<button data-k="${k}" data-v="${v}" aria-pressed="${st[k] === v}">${optText(k, v)}</button>`).join('')}</div>`).join('') +
      (game.id === 'poker' ? '<div class="muted">Play money only — no real money involved.</div>' : '') : '';
    const n = S.players.filter((p) => p.connected).length;
    $('startBtn').textContent = `Start ${game.name}`;
    $('startBtn').disabled = n < game.min;
    $('lobbyErr').textContent = n < game.min ? `Needs ${game.min}+ players — ${n} here` : S.notice || '';
  } else {
    $('lobbyInfo').textContent = `${host ? host.name : 'The host'} is picking a game — ${game.name} selected` + (game.options ? ` (${settingsLine(game)})` : '');
  }
}

function renderFinal() {
  show('final');
  const r = S.results || [];
  const rank = r.findIndex((x) => x.id === YOU.id) + 1;
  const me = r[rank - 1];
  if (me && me.money) {
    $('finalTitle').textContent = me.score > 0 ? `You're up ${signed(me.score)}` : me.score < 0 ? `You're down ${money(-me.score)}` : 'You broke even';
    $('finalSub').textContent = `Bought in ${money(me.bought)} · cashed out ${money(me.final)} · play money`;
  } else if (me && me.place && me.unit === 'pts') {
    $('finalTitle').textContent = rank === 1 ? 'You won the Cup!' : `You finished ${ordinal(rank)} in the Cup`;
    $('finalSub').textContent = `${me.score} points · winner: ${r[0].name}`;
  } else if (me && me.place) {
    $('finalTitle').textContent = rank === 1 ? 'You won the race!' : `You finished ${ordinal(rank)}`;
    $('finalSub').textContent = (me.time != null ? `${Math.floor(me.time / 60)}:${String((me.time % 60).toFixed(1)).padStart(4, '0')}` : 'Did not finish') + (me.bestLap ? ` · best lap ${me.bestLap.toFixed(1)}s` : '');
  } else {
    $('finalTitle').textContent = rank === 1 ? 'You won!' : rank ? `You finished #${rank}` : 'Game over';
    $('finalSub').textContent = (me ? `${fmt(me.score)} ${me.unit} · ` : '') + (r[0] ? `winner: ${r[0].name}` : '');
  }
  $('meInfo').textContent = '';
  $('againBtn').style.display = YOU.isHost ? 'block' : 'none';
}

function cardHtml(c) {
  if (!c || hideCards) return `<div class="pc back"></div>`;
  const r = c[0] === 'T' ? '10' : c[0], red = c[1] === 'h' || c[1] === 'd';
  return `<div class="pc${red ? ' red' : ''}">${r}${SUIT[c[1]]}</div>`;
}

function renderPoker() {
  if (!S || !S.g || S.g.kind !== 'poker') return;
  show('poker');
  const g = S.g, me = YOU.g;
  $('meInfo').innerHTML = me.seated ? `${money(me.chips)} · <span style="color:${me.net > 0 ? '#5EE6C8' : me.net < 0 ? '#FF9F9F' : '#A9AEC8'}">net ${signed(me.net)}</span>` : '';
  const b = $('pkBanner');
  b.style.background = '#1A1D33'; b.style.color = '#F4F5FA';
  const turnSeat = g.seats.find((x) => x.turn);
  if (!me.seated) b.textContent = 'Table is full — watch the TV';
  else if (me.cashed) b.textContent = `Cashed out ${money(me.chips)} — watching`;
  else if (g.phase === 'waiting') b.textContent = me.chips > 0 ? 'Waiting for someone to rebuy…' : 'Out of chips — rebuy to keep playing';
  else if (!me.dealt) b.textContent = me.pending ? `Rebuy lands next hand` : me.chips > 0 ? 'You join the next hand' : 'Out of chips';
  else if (g.phase !== 'hand') b.textContent = g.winners.map((w) => `${w.pid === YOU.id ? 'You win' : w.name + ' wins'} ${money(w.amount)}${w.hand ? ' · ' + w.hand : ''}`).join(' · ');
  else if (me.myTurn) { b.textContent = `Your turn · ${me.toCall ? 'Call ' + money(me.toCall) : 'Check or bet'}`; b.style.background = '#FFC83D'; b.style.color = '#0E1020'; }
  else if (me.folded) b.textContent = 'You folded';
  else if (me.allIn) b.textContent = 'You\'re all in';
  else b.textContent = turnSeat ? `Waiting for ${turnSeat.name}` : 'Dealing…';

  $('hole').innerHTML = me.dealt ? (me.cards || []).map(cardHtml).join('') : '';
  $('pkHand').textContent = me.dealt && !hideCards ? `${me.hand} · tap cards to ${hideCards ? 'show' : 'hide'}` : (me.dealt ? 'Tap cards to show' : '');

  const showBank = me.seated && !me.myTurn && (me.canRebuy || me.canCashOut);
  $('pkBank').style.display = showBank ? 'flex' : 'none';
  $('rebuyBtn').style.display = me.canRebuy ? 'block' : 'none';
  $('rebuyBtn').textContent = `Rebuy ${money(me.buyIn)}` + (me.dealt && !me.folded && g.phase === 'hand' ? ' (next hand)' : '');
  $('cashBtn').style.display = me.canCashOut ? 'block' : 'none';
  $('cashBtn').textContent = `Cash out ${money(me.chips + me.pending)} & watch`;
  const c = $('pkControls');
  c.style.display = me.myTurn ? 'flex' : 'none';
  if (me.myTurn) {
    if (!wasMyTurn) { raiseTo = me.minTo; }
    raiseTo = Math.min(Math.max(raiseTo, me.minTo), me.maxTo);
    const r = $('raise');
    r.min = me.minTo; r.max = me.maxTo; r.step = me.bb; r.value = raiseTo;
    const half = Math.max(me.minTo, me.currentBet + Math.round(g.pot / 2 / me.bb) * me.bb), pot = Math.max(me.minTo, me.currentBet + g.pot);
    $('presets').innerHTML = [['Min', me.minTo], ['½ pot', Math.min(half, me.maxTo)], ['Pot', Math.min(pot, me.maxTo)], ['All in', me.maxTo]]
      .map(([l, v]) => `<button data-v="${v}">${l}</button>`).join('');
    $('callBtn').textContent = me.canCheck ? 'Check' : (me.toCall >= me.chips ? `All in ${money(me.toCall)}` : `Call ${money(me.toCall)}`);
    const canRaise = me.maxTo > me.currentBet && me.chips > me.toCall;
    $('raiseBtn').style.visibility = canRaise ? 'visible' : 'hidden';
    $('presets').style.display = canRaise ? 'grid' : 'none';
    r.style.display = canRaise ? 'block' : 'none';
    updateRaise();
  }
  wasMyTurn = me.myTurn;
}

connect();
</script>
</body>
</html>
