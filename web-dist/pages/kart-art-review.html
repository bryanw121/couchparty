<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kario Mart · Art Studio</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#d9edf6;color:#20364d;font:16px/1.4 system-ui,sans-serif}header{position:absolute;inset:0 0 auto;padding:20px 24px;z-index:2;pointer-events:none}h1{margin:0;font-size:clamp(25px,5vw,40px);letter-spacing:-1px}header p{margin:3px 0;color:#526a80;font-size:14px}#view{position:fixed;inset:0}#view canvas{display:block;width:100%;height:100%;touch-action:none}#controls{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translate(-50%);width:min(94%,780px);background:#fffffff0;backdrop-filter:blur(20px);border:1px solid #fff;border-radius:24px;padding:16px;box-shadow:0 12px 50px #20364d20;display:flex;flex-wrap:wrap;gap:12px;align-items:end}label{display:flex;flex:1 1 130px;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:#61788b}select,button{font:600 15px system-ui;min-height:44px;border-radius:12px;border:1px solid #cadde8;padding:10px;background:#f2f8fc;color:#20364d}button{cursor:pointer}#status{position:absolute;top:45%;width:100%;text-align:center;padding:24px}.hint{width:100%;font-size:12px;color:#61788b;text-align:center;margin:0}@media(max-width:520px){header{padding:16px}#controls{gap:8px;padding:12px}label{flex-basis:100px}select{max-width:100%}}
</style></head><body><div id="view"></div><header><h1>KARIO MART · ART STUDIO</h1><p>Explore the game’s 3D models and courses.</p></header><p id="status">Loading the art studio…</p><div id="controls"><label>Collection<select id="collection"><option value="kart">Karts</option><option value="character">Characters</option><option value="item">Items</option><option value="course">Courses & tracks</option></select></label><label>Model<select id="model"></select></label><label>Lighting<select id="lighting"><option value="meadow">Village daylight</option><option value="sunset">Harbor sunset</option><option value="frosty">Snow daylight</option><option value="neon">Metro night</option></select></label><button id="shortcut" type="button" hidden>Explore shortcut</button><button id="race-preview" type="button">Watch race camera</button><button id="rotate" type="button">Pause rotation</button><p class="hint">Drag to turn · Pinch to zoom · Same models, materials and lighting as the race</p></div><script src="https://cdn.jsdelivr.net/gh/bryanw121/couchparty@94b379a1fc6db0d05c397a8e5dc53860737a5a4a/web-dist/kart-art-review.js" onerror="document.getElementById('status').textContent='The studio could not load. Please refresh.'"></script></body></html>
